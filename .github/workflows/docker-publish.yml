name: Publish Docker Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write

env:
  REGISTRY: ghcr.io

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build frontend artifact
        uses: ./.github/actions/build-frontend
        with:
          artifact-name: komari-frontend

  build-docker-binaries:
    needs: build-frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore frontend artifact
        uses: ./.github/actions/restore-frontend

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          check-latest: true

      - name: Install Zig
        uses: ./.github/actions/setup-zig

      - name: Build static binaries for multi-arch
        env:
          GOOS: linux
          CGO_ENABLED: 1
          GIN_MODE: release
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION_HASH="${{ github.sha }}"
          LDFLAGS="-s -w -X github.com/komari-monitor/komari/utils.CurrentVersion=${VERSION} -X github.com/komari-monitor/komari/utils.VersionHash=${VERSION_HASH}"

          echo "Building for linux/amd64..."
          GOARCH=amd64 CC="zig cc -target x86_64-linux-musl" go build -trimpath -ldflags="$LDFLAGS" -o komari-linux-amd64

          echo "Building for linux/arm64..."
          GOARCH=arm64 CC="zig cc -target aarch64-linux-musl" go build -trimpath -ldflags="$LDFLAGS" -o komari-linux-arm64

      - name: Upload Docker binaries
        uses: actions/upload-artifact@v4
        with:
          name: komari-docker-binaries
          path: komari-linux-*

  build-and-push-multi-arch:
    needs: build-docker-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker binaries
        uses: actions/download-artifact@v4
        with:
          name: komari-docker-binaries
          path: .

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_USERNAME || 'zaofengyue' }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Set lowercase image name
        run: echo "IMAGE_NAME_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Configure target images
        id: target-images
        run: |
          IMAGES="${{ env.REGISTRY }}/${IMAGE_NAME_LOWER}"
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            HUB_USER="$DOCKERHUB_USERNAME"
            if [ -z "$HUB_USER" ]; then
              HUB_USER="zaofengyue"
            fi
            IMAGES="${IMAGES}
          ${HUB_USER}/komari"
          else
            IMAGES="${IMAGES}
          zaofengyue/komari"
          fi
          echo "images<<EOF" >> $GITHUB_OUTPUT
          echo "$IMAGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.target-images.outputs.images }}
          tags: |
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Cleanup old workflow runs and old package versions
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRunId = context.runId;

            // 1. 清理历史工作流运行记录（保留当前这一次，其余一个不留）
            console.log('--- 开始清理历史工作流运行记录 ---');
            try {
              let hasMore = true;
              while (hasMore) {
                const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                  owner,
                  repo,
                  per_page: 50,
                  page: 1
                });
                const runs = data.workflow_runs.filter(r => r.id !== currentRunId);
                if (!runs || runs.length === 0) {
                  hasMore = false;
                  break;
                }
                for (const run of runs) {
                  try {
                    await github.rest.actions.deleteWorkflowRun({
                      owner,
                      repo,
                      run_id: run.id
                    });
                    console.log(`已删除工作流记录 ID: ${run.id} (${run.name})`);
                  } catch (e) {
                    console.log(`删除记录 ${run.id} 失败: ${e.message}`);
                  }
                }
                if (data.workflow_runs.length < 50) {
                  hasMore = false;
                }
              }
              console.log('--- 历史工作流运行记录清理完毕 ---');
            } catch (err) {
              console.log(`清理工作流运行记录出现异常: ${err.message}`);
            }

            // 2. 清理旧镜像版本（只保留含有 latest 标签的版本）
            console.log('--- 开始清理旧镜像版本 ---');
            const packageName = repo.toLowerCase();
            try {
              let versions = [];
              try {
                const res = await github.rest.packages.getAllPackageVersionsForPackageOwnedByUser({
                  package_type: 'container',
                  package_name: packageName,
                  username: owner
                });
                versions = res.data;
              } catch (e1) {
                try {
                  const res = await github.rest.packages.getAllPackageVersionsForPackageOwnedByAuthenticatedUser({
                    package_type: 'container',
                    package_name: packageName
                  });
                  versions = res.data;
                } catch (e2) {
                  console.log(`获取 package 列表失败: ${e2.message}`);
                }
              }

              for (const ver of versions) {
                const tags = ver.metadata?.container?.tags || [];
                if (!tags.includes('latest')) {
                  try {
                    await github.rest.packages.deletePackageVersionForUser({
                      package_type: 'container',
                      package_name: packageName,
                      username: owner,
                      package_version_id: ver.id
                    });
                    console.log(`已删除旧镜像版本 ID: ${ver.id}，标签: [${tags.join(', ')}]`);
                  } catch (e3) {
                    try {
                      await github.rest.packages.deletePackageVersionForAuthenticatedUser({
                        package_type: 'container',
                        package_name: packageName,
                        package_version_id: ver.id
                      });
                      console.log(`已删除旧镜像版本 ID: ${ver.id}，标签: [${tags.join(', ')}]`);
                    } catch (e4) {
                      console.log(`删除版本 ${ver.id} 遇到权限或API限制: ${e4.message}`);
                    }
                  }
                } else {
                  console.log(`保留最新镜像版本 ID: ${ver.id}，标签: [${tags.join(', ')}]`);
                }
              }
              console.log('--- 旧镜像版本清理完毕 ---');
            } catch (err) {
              console.log(`清理镜像版本出现异常: ${err.message}`);
            }

